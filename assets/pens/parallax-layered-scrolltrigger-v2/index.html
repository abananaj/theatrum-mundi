<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>parallax groups layers</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/modernizr/2.8.3/modernizr.min.js" type="text/javascript"></script>

<link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">
<link rel='stylesheet' href='https://use.typekit.net/qxm4hdp.css'>
<link rel='stylesheet' href='https://use.typekit.net/bmw4zvq.css'><link rel="stylesheet" href="./style.css">
<script src="https://public.codepenassets.com/js/prefixfree-1.0.7.min.js"></script>

</head>
<body>
<!-- partial:index.partial.html -->
<div class="debug">
	<label><input type="checkbox"> Debug</label>
</div>

<div class="parallax debug-on">
	<div id="group1" class="red prlx-group">
		<div class="prlx-layer prlx-midground">
			<div class="content">Group1 Midground</div>
		</div>
	</div>
	<div id="group2" class="orange prlx-group">
		<div class="prlx-layer prlx-midground">
			<div class="content">Group2 Midground</div>
		</div>
		<div class="prlx-layer prlx-background">
			<div class="content">Group2 Background</div>
		</div>
	</div>
	<div id="group3" class="yellow prlx-group">
		<div class="prlx-layer prlx-foreground">
			<div class="content">Group3 Foreground</div>
		</div>
		<div class="prlx-layer prlx-midground">
			<div class="content">Group3 Midground</div>
		</div>
	</div>
	<div id="group4" class="green prlx-group">
		<div class="prlx-layer prlx-midground">
			<div class="content">Group4 Midground</div>
		</div>
		<div class="prlx-layer prlx-background">
			<div class="content">Group4 Background</div>
		</div>
		<div class="prlx-layer prlx-deepground">
			<div class="content">Group4 Deepground</div>
		</div>
	</div>
	<div id="group5" class="blue prlx-group">
		<div class="prlx-layer prlx-foreground">
			<div class="content">Group6 Foreground</div>
		</div>
		<div class="prlx-layer prlx-midground">
			<div class="content">Group5 Midground</div>
		</div>
	</div>
	<div id="group6" class="purple prlx-group">
		<div class="prlx-layer prlx-background">
			<div class="content">Group6 Background</div>
		</div>
		<div class="prlx-layer prlx-midground">
			<div class="content">Group6 Midground</div>
		</div>
	</div>
	<div id="group7" class="magenta prlx-group">
		<div class="prlx-layer prlx-midground">
			<div class="content">Group7 Midground</div>
		</div>
	</div>
</div>
<!-- partial -->
  <script  src="./script.js"></script>

</body>
</html>
